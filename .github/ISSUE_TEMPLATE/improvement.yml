name: Sugerir uma melhoria
description: Uma ideia para tornar o Moldura mais útil ou mais simples.
body:
  - type: textarea
    id: need
    attributes:
      label: O que você precisa fazer?
      description: Descreva a dificuldade que encontra hoje.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como poderia funcionar?
      description: Explique sua ideia ou mostre uma referência sem informações pessoais.
